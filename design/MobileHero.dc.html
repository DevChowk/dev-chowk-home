<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #8f6425; text-decoration: none; }
    a:hover { color: #12110f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf7f2; color: #12110f; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- jaali -->
  <svg width="460" height="460" viewBox="0 0 460 460" style="position: absolute; top: 300px; right: -170px; pointer-events: none;">
    <defs>
      <pattern id="jm" width="92" height="92" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#8f6425" stroke-width="1" opacity="0.26">
          <path d="M46 0 L92 46 L46 92 L0 46 Z"/>
          <circle cx="46" cy="46" r="23"/>
          <path d="M0 0 L92 92 M92 0 L0 92"/>
        </g>
      </pattern>
      <radialGradient id="fm" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="mm"><rect width="460" height="460" fill="url(#fm)"/></mask>
    </defs>
    <rect width="460" height="460" fill="url(#jm)" mask="url(#mm)"/>
  </svg>

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 64px 24px 18px; border-bottom: 1px solid #e0d8cb; position: relative; z-index: 2;">
    <div style="display: flex; align-items: center; gap: 10px; height: 44px;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#8f6425" stroke-width="1.5">
        <path d="M10 1 L19 10 L10 19 L1 10 Z"/><path d="M10 6 L14 10 L10 14 L6 10 Z"/>
      </svg>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.16em;">DEV CHOWK</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#6b645a" stroke-width="1.4" stroke-linecap="round">
          <circle cx="10" cy="10" r="4"/>
          <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.6 3.6l1.4 1.4M15 15l1.4 1.4M16.4 3.6L15 5M5 15l-1.4 1.4"/>
        </svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px;">
        <span style="width: 22px; height: 1.5px; background: #12110f;"></span>
        <span style="width: 15px; height: 1.5px; background: #12110f;"></span>
      </div>
    </div>
  </div>

  <!-- hero body -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 0 24px; position: relative; z-index: 2;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8f6425;">00</span>
      <span style="width: 26px; height: 1px; background: #8f6425;"></span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #6b645a;">THE GATE</span>
    </div>

    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 50px; line-height: 1.0; letter-spacing: -0.025em; font-weight: 400; text-wrap: pretty;">
      Every city has a <span style="font-family: 'Tiro Devanagari Hindi', 'Instrument Serif', serif; color: #8f6425;">चौक</span>.
      <span style="font-style: italic;">Ours</span> is built from code.
    </h1>

    <p style="margin: 0; font-size: 16px; line-height: 1.65; color: #6b645a;">
      A software studio in [YOUR CITY]. We design, build and ship products for founders who
      need the thing to work, not to demo.
    </p>

    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 10px;">
      <div style="background: #12110f; color: #faf7f2; font-size: 16px; font-weight: 500; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        Start a project
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#faf7f2" stroke-width="1.5" stroke-linecap="round"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
      </div>
      <div style="border: 1px solid #12110f; color: #12110f; font-size: 16px; font-weight: 500; height: 52px; display: flex; align-items: center; justify-content: center;">
        See how we work
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 48px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #6b645a; border: 1px solid #e0d8cb;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#8f6425" stroke-width="1.4">
          <rect x="1.5" y="3.5" width="13" height="9"/><path d="M4.5 12.5v-4h3v4M9.5 12.5v-2h2.5v2"/>
        </svg>
        WALK THE CHOWK
      </div>
    </div>
  </div>

  <!-- foot -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 30px; border-top: 1px solid #e0d8cb; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #6b645a; position: relative; z-index: 2;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 5px; height: 5px; background: #8f6425; border-radius: 50%;"></span>
      TAKING ON NEW WORK
    </div>
    <span>[MONTH YEAR]</span>
  </div>

</div>
</x-dc>
</body>
</html>
